<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gr-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#08090D" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#gr-grad)" stroke-width="1.5" stroke-opacity="0.4" />
  <!-- GR Monogram -->
  <text x="32" y="42" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="800" font-size="28" fill="url(#gr-grad)" text-anchor="middle" letter-spacing="-1" filter="url(#glow)">GR</text>
</svg>